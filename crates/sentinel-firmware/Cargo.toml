[package]
name = "sentinel-firmware"
version.workspace = true
edition = "2021"

[package.metadata.espflash]
partition_table = "partitions.csv"


[dependencies]
sentinel-core = { path = "../sentinel-core" }
heapless = "0.8"
serde = { workspace = true, features = ["derive"] }
critical-section = "1.2"

[dev-dependencies]
serde_json = "1.0"

# Only build ESP hardware crates when targeting the actual microcontroller
[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal         = { workspace = true }
esp-hal-embassy = { workspace = true }
esp-wifi        = { workspace = true }
esp-alloc       = "0.6"
embassy-net     = { workspace = true }
static_cell     = "2.1"
esp-println     = { version = "0.13", default-features = false, features = ["esp32s3", "uart"] }
esp-backtrace   = { version = "0.15", features = ["esp32s3", "panic-handler", "println"] }
embassy-executor = { version = "0.7", features = ["nightly"] }
embassy-time    = "0.4"
embassy-sync    = { workspace = true }
embedded-io-async = "0.6"
esp-storage     = { version = "0.4", features = ["esp32s3", "nor-flash"] }
embedded-storage = "0.3"

