[workspace]
resolver = "3"
members = [
    "crates/sentinel-core",
    "crates/sentinel-proto",
    "crates/sentinel-tinyml",
    "crates/sentinel-firmware",
    "crates/sentinel-gateway",
    "crates/sentinel-dashboard",
    "crates/sentinel-cli",
    "crates/sentinel-sim",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2027"
rust-version = "1.98.1"
authors = ["Vinh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/vinhrook/Sentinel"
  
[workspace.dependencies]
# the core domain crate
sentinel-core = { path = "crates/sentinel-core" }
sentinel-proto = { path = "crates/sentinel-proto" }
sentinel-tinyml = { path = "crates/sentinel-tinyml" }
sentinel-sim = { path = "crates/sentinel-sim" }

# shared Dependencies